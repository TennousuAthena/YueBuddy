name: yue_buddy
description: 粤语伴 YueBuddy — 普通话到粤语的口袋练习册
publish_to: "none"
version: 0.1.0+1

environment:
  sdk: ^3.9.0

dependencies:
  flutter:
    sdk: flutter
  cupertino_icons: ^1.0.8
  flutter_tts: ^4.2.3
  shared_preferences: ^2.5.3
  http: ^1.6.0
  audioplayers: ^6.8.1
  crypto: ^3.0.6
  url_launcher: ^6.3.2

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^5.0.0
  flutter_launcher_icons: ^0.14.4

flutter_launcher_icons:
  image_path: assets/icon/icon_square.png
  android: ic_launcher
  min_sdk_android: 21
  adaptive_icon_background: "#58CC02"
  adaptive_icon_foreground: assets/icon/icon_square.png
  adaptive_icon_foreground_inset: 0
  ios: true
  remove_alpha_ios: true
  background_color_ios: "#58CC02"
  web:
    generate: true
    background_color: "#F7F7F7"
    theme_color: "#58CC02"
  windows:
    generate: true
    icon_size: 256
  macos:
    generate: true

# OpenHarmony implementations live in-tree so Hvigor sees relative paths.
# Other platforms keep the implementations shipped inside these forks.
dependency_overrides:
  shared_preferences:
    path: third_party/ohos/shared_preferences_repo/packages/shared_preferences/shared_preferences
  shared_preferences_ohos:
    path: third_party/ohos/shared_preferences_repo/packages/shared_preferences/shared_preferences_ohos
  url_launcher:
    path: third_party/ohos/url_launcher_repo/packages/url_launcher/url_launcher
  url_launcher_ohos:
    path: third_party/ohos/url_launcher_repo/packages/url_launcher/url_launcher_ohos
  flutter_tts:
    path: third_party/ohos/flutter_tts
  audioplayers:
    path: third_party/ohos/audioplayers_repo/packages/audioplayers
  audioplayers_ohos:
    path: third_party/ohos/audioplayers_repo/packages/audioplayers_ohos
  audioplayers_android:
    path: third_party/ohos/audioplayers_repo/packages/audioplayers_android
  audioplayers_darwin:
    path: third_party/ohos/audioplayers_repo/packages/audioplayers_darwin
  audioplayers_linux:
    path: third_party/ohos/audioplayers_repo/packages/audioplayers_linux
  audioplayers_windows:
    path: third_party/ohos/audioplayers_repo/packages/audioplayers_windows
  audioplayers_web:
    path: third_party/ohos/audioplayers_repo/packages/audioplayers_web
  audioplayers_platform_interface:
    path: third_party/ohos/audioplayers_repo/packages/audioplayers_platform_interface
  path_provider:
    path: third_party/ohos/path_provider_repo/packages/path_provider/path_provider
  path_provider_ohos:
    path: third_party/ohos/path_provider_repo/packages/path_provider/path_provider_ohos

flutter:
  uses-material-design: true
  assets:
    - assets/icon/icon_square.png
    - assets/lessons/
    - assets/glossary/
    - assets/illustrations/irasutoya/
    - assets/jyutping/chars.json
    - assets/audio/l1/
    - assets/audio/l2/
    - assets/audio/l3/
