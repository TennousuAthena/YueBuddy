name: yue_buddy
description: 粤语伴 YueBuddy — 普通话到粤语的口袋练习册
publish_to: "none"
version: 0.1.0+1

environment:
  sdk: ^3.9.0

dependencies:
  flutter:
    sdk: flutter
  cupertino_icons: ^1.0.8
  flutter_tts: ^4.2.3
  shared_preferences: ^2.5.3
  http: ^1.6.0
  audioplayers: ^6.8.1
  crypto: ^3.0.6
  url_launcher: ^6.3.2

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^5.0.0

flutter:
  uses-material-design: true
  assets:
    - assets/lessons/
    - assets/glossary/
    - assets/illustrations/irasutoya/
    - assets/jyutping/chars.json
    - assets/audio/l1/
    - assets/audio/l2/
    - assets/audio/l3/
